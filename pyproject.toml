[project]
name = "crimosonguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
    "platformdirs>=3.0.0",
]

[project.scripts]
crimsonguard = "crimsonguard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crimsonguard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"